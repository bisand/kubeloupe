apiVersion: v1
kind: Namespace
metadata:
  name: lens-metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lens-metricsd
  namespace: lens-metrics
---
# Read-only, and narrow: Node and Pod objects supply capacity, requests
# and limits, and nodes/proxy reaches each kubelet's /stats/summary
# through the API server rather than opening a second TLS path to
# port 10250.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lens-metricsd
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lens-metricsd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lens-metricsd
subjects:
  - kind: ServiceAccount
    name: lens-metricsd
    namespace: lens-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lens-metricsd
  namespace: lens-metrics
  labels:
    app.kubernetes.io/name: lens-metricsd
spec:
  # Exactly one. The series live in the process, so a second replica
  # would hold a different history and the Service would alternate
  # between them -- graphs would flicker between two versions of the
  # truth depending on which pod answered.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lens-metricsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lens-metricsd
    spec:
      serviceAccountName: lens-metricsd
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lens-metricsd
          image: ghcr.io/bisand/lens-metricsd:0.1.0
          # IfNotPresent rather than Always: the node already holds this
          # tag, so a restart never depends on the registry being
          # reachable -- but a rebuilt node can still pull it.
          imagePullPolicy: IfNotPresent
          env:
            # 30s against Lens' 60s display step leaves rate() two samples
            # per point. 24h covers Lens' longest range.
            - name: SCRAPE_INTERVAL_SECONDS
              value: "30"
            - name: RETENTION_HOURS
              value: "24"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            # Sized for the store: ~400 series x 2880 samples x 16 bytes
            # is about 18 MB, plus the runtime. Raise this before raising
            # RETENTION_HOURS.
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# The name and namespace are load-bearing. Lens' built-in "Lens" provider
# does a literal lookup of the Service named `prometheus` in namespace
# `lens-metrics` and takes ports[0].port -- match both and Lens
# auto-detects with no configuration at all.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lens-metrics
  labels:
    app.kubernetes.io/name: lens-metricsd
spec:
  selector:
    app.kubernetes.io/name: lens-metricsd
  ports:
    - name: http
      port: 80
      targetPort: http
