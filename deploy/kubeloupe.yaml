apiVersion: v1
kind: Namespace
metadata:
  name: lens-metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeloupe
  namespace: lens-metrics
---
# Read-only, and narrow: Node and Pod objects supply capacity, requests
# and limits, and nodes/proxy reaches each kubelet's /stats/summary
# through the API server rather than opening a second TLS path to
# port 10250.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeloupe
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeloupe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeloupe
subjects:
  - kind: ServiceAccount
    name: kubeloupe
    namespace: lens-metrics
---
# 64Mi against a snapshot of roughly 1 MB at the default 24h retention --
# the file holds the store's compressed chunks verbatim. Sized well clear
# of that because save() writes a temporary file beside the live one and
# renames, so the peak is both together. No storageClassName, so it takes
# the cluster default (local-path on k3s).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeloupe
  namespace: lens-metrics
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeloupe
  namespace: lens-metrics
  labels:
    app.kubernetes.io/name: kubeloupe
spec:
  # Exactly one. The series live in the process, so a second replica
  # would hold a different history and the Service would alternate
  # between them -- graphs would flicker between two versions of the
  # truth depending on which pod answered. Recreate rather than
  # RollingUpdate is now load-bearing too: the snapshot volume is RWO and
  # two pods could not mount it at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeloupe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeloupe
    spec:
      serviceAccountName: kubeloupe
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        # Without this the provisioner's root-owned directory is not
        # writable by 65534 and every snapshot fails with EACCES -- while
        # the daemon otherwise runs perfectly, so it only shows up as
        # history that never survives a restart.
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeloupe
          image: ghcr.io/bisand/kubeloupe:0.2.11
          # IfNotPresent rather than Always: the node already holds this
          # tag, so a restart never depends on the registry being
          # reachable -- but a rebuilt node can still pull it.
          imagePullPolicy: IfNotPresent
          env:
            # 30s against Lens' 60s display step leaves rate() two samples
            # per point. 24h covers Lens' longest range.
            - name: SCRAPE_INTERVAL_SECONDS
              value: "30"
            - name: RETENTION_HOURS
              value: "24"
            # Unset would disable persistence. This path is the mounted
            # volume below.
            - name: SNAPSHOT_PATH
              value: /var/lib/kubeloupe/snapshot.bin
            # The upper bound on history lost to an UNCLEAN kill. A
            # rollout or any other SIGTERM writes a final snapshot and
            # costs nothing.
            - name: SNAPSHOT_INTERVAL_SECONDS
              value: "300"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            # readOnlyRootFilesystem below still applies: it makes the
            # ROOT filesystem read-only, and mounted volumes stay
            # writable, so persistence costs none of the hardening.
            - name: snapshot
              mountPath: /var/lib/kubeloupe
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            # Sized for the store: ~400 series x 2880 samples x ~1.9 bytes
            # is about 2 MB, plus the runtime. Deliberately left with room
            # to spare -- the request has not been lowered to match until
            # the compressed build has a day of real measurement behind
            # it. Raise the limit before raising RETENTION_HOURS.
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: snapshot
          persistentVolumeClaim:
            claimName: kubeloupe
---
# The name and namespace are chosen so Lens needs no configuration: its
# built-in provider does a literal lookup of the Service `prometheus` in
# namespace `lens-metrics` and is declared `isConfigurable: false`, so this
# is the one path in that requires no address typed anywhere. That is also
# why Lens' bundled metrics must stay off -- enabling them puts a second
# Service by this name in this namespace. Rename both to `kubeloupe` if you
# would rather have your own namespace; the daemon does not care, but Lens
# then needs PROMETHEUS set to `Helm` and an explicit service address.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lens-metrics
  labels:
    app.kubernetes.io/name: kubeloupe
spec:
  selector:
    app.kubernetes.io/name: kubeloupe
  ports:
    - name: http
      port: 80
      targetPort: http
