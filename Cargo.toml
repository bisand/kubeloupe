[package]
name = "kubeloupe"
version = "0.2.3"
edition = "2024"
license = "Apache-2.0"

# Built to fit a one-core node. Thin LTO keeps most of the size win for
# markedly less build time; `strip` is left out so a panic still names
# functions in the backtrace.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1"
# Already in the tree under reqwest's `url`; naming it directly adds no code,
# and repeated `match[]` parameters need it -- serde_urlencoded keeps only
# the last occurrence of a repeated key.
form_urlencoded = "1"
# Only ever talks to the API server, over one connection, with the
# ServiceAccount CA supplied explicitly -- hence manual-roots rather than
# a bundled root store the scratch image would otherwise have to carry.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-manual-roots",
    "json",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Label matchers are `=~` regexes. regex-lite over regex: the patterns are
# tiny alternations of node and pod names, none of the performance is
# needed, and it costs roughly 1.5 MB less in the binary.
regex-lite = "0.1"
# A single-threaded runtime on purpose: the node has one core, and a work
# stealing scheduler would only add contention.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "time",
    "signal",
    "sync",
] }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "query",
    "json",
    "form",
] }

[dev-dependencies]
# Already present under axum -- dev-only, so the shipped binary is unchanged.
tower = { version = "0.5", features = ["util"] }
