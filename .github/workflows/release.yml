# Publishes the image when a GitHub release is PUBLISHED, not merely when
# a tag is pushed. A tag is a bookmark and is cheap to push by accident or
# to move while preparing something; a release is a deliberate act with
# notes attached. Tying the image to the release means what is on ghcr
# always corresponds to something a human decided to ship and wrote a
# changelog for.
#
# Publishing a release still requires a tag, so `type=semver` below reads
# the version from `github.ref` exactly as before.
#
# Built per-architecture on native runners and merged into one manifest
# afterwards. Emulating an arm64 Rust build under QEMU takes tens of
# minutes; ubuntu-24.04-arm does it natively in the same time as amd64,
# and is free for public repositories.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Every version written by hand must agree with the tag being released.
  # The manifest is the one that bites: the quick start applies
  # deploy/kubeloupe.yaml straight from the default branch, so a release
  # cut without bumping the image tag in it publishes an image nobody
  # installs -- everyone following the README keeps getting the previous
  # version, and nothing says so. Cargo.toml is cosmetic by comparison,
  # nothing reads CARGO_PKG_VERSION, but it is checked for the same reason
  # it is kept current: a version that disagrees reads as a mistake, and
  # drift only grows. Checked before the build, so a forgotten bump costs a
  # retag instead of a wrong image sitting on ghcr under the right name.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Every hand-written version must name the release
        run: |
          # workflow_dispatch runs from a branch, where there is no version
          # to agree with. Skipped in the step rather than with `if:`, since
          # a skipped job would skip everything that needs it.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "not a tag ref -- nothing to check"; exit 0 ;;
          esac

          version="${GITHUB_REF_NAME#v}"
          pinned=$(grep -oE "image: ${IMAGE}:[^[:space:]]+" deploy/kubeloupe.yaml | sed 's|.*:||' | sort -u)

          if [ -z "$pinned" ]; then
            echo "::error::deploy/kubeloupe.yaml names no ${IMAGE} image"
            exit 1
          fi
          if [ "$pinned" != "$version" ]; then
            echo "::error::deploy/kubeloupe.yaml pins '${pinned}', but v${version} is being released -- bump it, move the tag, and publish again"
            exit 1
          fi

          crate=$(grep -m1 '^version = ' Cargo.toml | sed 's|.*"\(.*\)".*|\1|')

          if [ "$crate" != "$version" ]; then
            echo "::error::Cargo.toml says '${crate}', but v${version} is being released -- bump it (and Cargo.lock, which carries it too), move the tag, and publish again"
            exit 1
          fi

          echo "deploy/kubeloupe.yaml pins ${pinned}, Cargo.toml says ${crate}"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    needs: [verify]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Sanitise the platform into a filename
        run: echo "PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the human-readable tags are applied once,
      # to the merged manifest, by the job below.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
